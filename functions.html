<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Functions</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CUSTOM_TERMS = [
            "FDA", "IND", "NDA", "BLA", "ANDA", "DMF", "CTD", "eCTD",
            "PK", "PD", "ADME", "AUC", "Cmax", "Tmax", "API", "GMP",
            "cGMP", "ICH", "QbD", "PAT", "CPP", "CQA", "QTPP"
        ];
        
        const LOWERCASE_WORDS = ["a", "an", "the", "at", "by", "of", "in", "on", "to", "and", "but", "for", "or", "nor", "so", "yet"];

        // ============================================
        // OFFICE.JS INITIALIZATION
        // ============================================
        Office.onReady(() => {
            // Register functions for ribbon buttons
            Office.actions.associate("applyTitleCase", applyTitleCase);
            Office.actions.associate("applySentenceCase", applySentenceCase);
        });

        // ============================================
        // RIBBON BUTTON FUNCTIONS
        // ============================================
        async function applyTitleCase(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.load("text");
                    await context.sync();
                    
                    const originalText = selection.text;
                    if (originalText && originalText.trim() !== "") {
                        const convertedText = convertToTitleCase(originalText);
                        selection.insertText(convertedText, Word.InsertLocation.replace);
                        await context.sync();
                    }
                });
            } catch (error) {
                console.error(error);
            }
            event.completed();
        }
        
        async function applySentenceCase(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.load("text");
                    await context.sync();
                    
                    const originalText = selection.text;
                    if (originalText && originalText.trim() !== "") {
                        const convertedText = convertToSentenceCase(originalText);
                        selection.insertText(convertedText, Word.InsertLocation.replace);
                        await context.sync();
                    }
                });
            } catch (error) {
                console.error(error);
            }
            event.completed();
        }

        // ============================================
        // TITLE CASE CONVERSION
        // ============================================
        function convertToTitleCase(text) {
            text = text.replace(/[\r\n]+/g, " ").trim();
            
            const words = text.split(" ");
            const result = [];
            
            for (let i = 0; i < words.length; i++) {
                let word = words[i].trim();
                if (word === "") continue;
                
                const cleanWord = removeTrailingPunctuation(word);
                const punctuation = word.substring(cleanWord.length);
                
                const customMatch = CUSTOM_TERMS.find(term => 
                    term.toLowerCase() === cleanWord.toLowerCase()
                );
                
                if (customMatch) {
                    result.push(customMatch + punctuation);
                } else if (i === 0 || i === words.length - 1) {
                    result.push(capitalizeFirst(cleanWord) + punctuation);
                } else if (isAcronym(cleanWord)) {
                    result.push(word);
                } else if (LOWERCASE_WORDS.includes(cleanWord.toLowerCase())) {
                    result.push(cleanWord.toLowerCase() + punctuation);
                } else {
                    result.push(capitalizeFirst(cleanWord) + punctuation);
                }
            }
            
            return result.join(" ");
        }

        // ============================================
        // SENTENCE CASE CONVERSION
        // ============================================
        function convertToSentenceCase(text) {
            text = text.replace(/[\r\n]+/g, " ").trim();
            
            if (text.length === 0) return "";
            
            let result = "";
            let capitalizeNext = true;
            let currentWord = "";
            
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                
                if (/[a-zA-Z0-9\-]/.test(ch)) {
                    currentWord += ch;
                } else {
                    if (currentWord !== "") {
                        result += processWordSentence(currentWord, capitalizeNext);
                        currentWord = "";
                        capitalizeNext = false;
                    }
                    
                    result += ch;
                    
                    if ((ch === "." || ch === "!" || ch === "?") && i < text.length - 1 && text[i + 1] === " ") {
                        capitalizeNext = true;
                    }
                }
            }
            
            if (currentWord !== "") {
                result += processWordSentence(currentWord, capitalizeNext);
            }
            
            return result;
        }
        
        function processWordSentence(word, capitalizeFirst) {
            const customMatch = CUSTOM_TERMS.find(term => 
                term.toLowerCase() === word.toLowerCase()
            );
            
            if (customMatch) {
                return customMatch;
            }
            
            if (isAcronym(word)) {
                return word;
            }
            
            if (capitalizeFirst) {
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            } else {
                return word.toLowerCase();
            }
        }

        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function removeTrailingPunctuation(word) {
            const punctuation = /[.,;:!?)\]}"']+$/;
            return word.replace(punctuation, "");
        }
        
        function capitalizeFirst(word) {
            if (word.length === 0) return word;
            return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        }
        
        function isAcronym(word) {
            const letters = word.replace(/[^a-zA-Z]/g, "");
            return letters.length >= 2 && letters.length <= 10 && letters === letters.toUpperCase();
        }
    </script>
</head>
<body>
</body>
</html>
